[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rclone-mcp"
version = "0.1.0"
description = "A dependency-light MCP stdio server exposing rclone safely to LLM clients"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "rclone-mcp contributors"}]

[project.scripts]
rclone-mcp = "rclone_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
